version: '3.8'

services:
  # Single service: the backend serves both the REST API and the web UI
  # (frontend/index.html) on port 8000.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./frontend/assets:/app/frontend/assets
    env_file:
      - .env
    environment:
      - RAW_DATA_PATH=/app/data/raw
      - DB_PATH=/app/data/footbot.db
